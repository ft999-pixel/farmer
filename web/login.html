<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入｜農民補給站</title>
<meta name="description" content="農民用 LINE 登入查看自己的資料；機關人員登入後臺維護補助與白話指南。">
<link rel="stylesheet" href="site-nav.css">
<style>
:root{
  --green-bright:#02DF82; --green-mid:#01B96B; --green-pale:#9FF5CF;
  --green-bg:#F0FDF6; --green-tint:#D9FBEC; --ink:#06301F; --ink-soft:#0A4A32;
  --orange:#D85A30; --warn-bg:#FEF3D8; --line:#CBEEDC; --line-green:#06C755;
}
@font-face{font-family:'GenSen';src:url('fonts/GenSenRounded2TW-R.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'GenSen';src:url('fonts/GenSenRounded2TW-M.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'GenSen';src:url('fonts/GenSenRounded2TW-H.woff2') format('woff2');font-weight:700;font-display:swap;}
*{box-sizing:border-box;}
body{margin:0;background:var(--green-bg);color:var(--ink);font-size:17px;
  font-family:'GenSen','Yuanti TC','Microsoft JhengHei',sans-serif;}
.nav-outer{max-width:1080px;margin:0 auto;padding:14px 20px 0;}
.nav-pill{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:10px 18px;flex-wrap:wrap;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;}
.nav-links{display:flex;gap:18px;flex-wrap:wrap;font-size:1.0625rem;font-weight:500;}
.nav-links a{text-decoration:none;color:var(--ink);white-space:nowrap;}
.nav-links a:hover,.nav-links a.current{color:var(--green-mid);}
.wrap{max-width:880px;margin:0 auto;padding:26px 20px 70px;}
h1{font-size:2rem;font-weight:700;margin:0 0 8px;text-align:center;}
.lead{color:var(--ink-soft);text-align:center;margin:0 0 28px;line-height:1.8;}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:28px 26px;
  display:flex;flex-direction:column;}
.card.farmer{border-color:var(--green-bright);}
.login-card{max-width:460px;margin:0 auto;}
.opt{display:block;font-size:.875rem;font-weight:400;color:var(--ink-soft);margin-top:2px;}
.btn-primary{background:var(--green-bright);color:var(--ink);}
.btn-primary:hover{background:var(--green-mid);}
button,.btn{font-family:inherit;font-size:1.125rem;font-weight:700;padding:15px 24px;
  border-radius:12px;border:none;cursor:pointer;width:100%;min-height:56px;
  display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;}
.btn-line{background:var(--line-green);color:#fff;}
.btn-line:hover{background:#05A648;}
.btn-admin{background:var(--ink);color:#fff;}
.btn-admin:hover{background:var(--ink-soft);}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:500;font-size:1rem;
  min-height:50px;}
.btn-ghost:hover{border-color:var(--green-mid);}
label{display:block;font-size:.9375rem;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
input{font-family:inherit;font-size:1.0625rem;padding:13px 14px;border:2px solid var(--line);
  border-radius:12px;width:100%;min-height:52px;color:var(--ink);}
input:focus{outline:3px solid var(--green-pale);border-color:var(--green-mid);}
.msg{padding:13px 16px;border-radius:12px;margin-bottom:18px;line-height:1.8;font-size:1rem;}
.msg.err{background:#FBE4DA;color:#8C2C0E;}
.msg.ok{background:var(--green-tint);color:var(--ink-soft);}
.msg.warn{background:var(--warn-bg);color:#6B4A00;}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink-soft);font-size:.9375rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
.hint{font-size:.9375rem;color:var(--ink-soft);line-height:1.75;margin:12px 0 0;}
.hide{display:none;}
.foot{text-align:center;margin-top:30px;font-size:.9375rem;color:var(--ink-soft);line-height:1.8;}
.foot a{color:var(--green-mid);}
</style>
</head>
<body>
<div data-site-nav></div>
<script src="site-nav.js"></script>

<div class="wrap">
  <h1>登入</h1>
  <p class="lead">
    登入後才看得到「我的資料」——你填過的作物、鄉鎮會留著，下次不用重講。<br>
    只是想查補助或看公文的話，不登入也可以直接用。
  </p>

  <div id="msg"></div>

  <section class="card farmer login-card">
    <!-- 農民主要路徑：LINE 登入，不用記帳號密碼 -->
    <div id="line-box">
      <a class="btn btn-line" href="/members/line/login">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 2C6.5 2 2 5.7 2 10.2c0 4 3.6 7.4 8.4 8.1.3.07.8.22.9.5.1.26.06.66.03.92l-.14.86c-.4.26-.2 1 .88.55 1.08-.46 5.8-3.42 7.9-5.85C21.4 13.6 22 12 22 10.2 22 5.7 17.5 2 12 2z"/>
        </svg>
        用 LINE 登入
      </a>
      <p class="hint" style="text-align:center">農民用這個最快，不用記帳號密碼</p>
    </div>

    <div class="divider">或用帳號密碼</div>

    <div>
      <label for="code">帳號</label>
      <input id="code" placeholder="例如：阿明伯" autocomplete="username">
    </div>

    <div style="margin-top:14px">
      <label for="pw">密碼</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="至少 6 個字">
    </div>

    <button class="btn btn-primary" id="do-login" style="margin-top:18px">登入</button>
    <button class="btn-ghost" id="do-register" style="margin-top:10px">我是第一次來，註冊一個</button>

    <p class="hint">
      登入後系統會依你的帳號自動帶你到該去的地方 —— 農民進「我的資料」，
      承辦人員進「後臺維護」，不用自己選。
    </p>
  </section>

  <p class="foot">
    還沒想登入？<a href="chat.html">直接說說你的狀況</a>　·　<a href="browse.html">自己找補助</a><br>
    也可以先看<a href="dashboard.html">卡點儀表板</a>（機關端公開資料）
  </p>
</div>

<script>
const $ = id => document.getElementById(id);
function msg(html, kind){ $('msg').innerHTML = html ? `<div class="msg ${kind}">${html}</div>` : ''; }
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// 從 LINE 導回時可能帶錯誤代碼，翻成白話
const LINE_ERRORS = {
  cancelled: '你取消了 LINE 登入。也可以用下面的代號登入。',
  bad_state: '登入連結已過期或不正確，請再按一次「用 LINE 登入」。',
  failed: 'LINE 登入沒有成功，請再試一次，或改用代號登入。',
};

// 角色寫在帳號上，去哪一頁由後端回傳的 redirect 決定，前端不做判斷。
async function submit(path){
  const username = $('code').value.trim();
  const password = $('pw').value;
  if (!username) { msg('請輸入帳號。', 'warn'); return; }
  if (!password) { msg('請輸入密碼。', 'warn'); return; }
  try {
    const r = await fetch(path, {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password}),
    });
    const body = await r.json();
    if (!r.ok) throw body;
    // 從被擋下的頁面過來就回去那裡；只收站內相對路徑，避免被導到外部網站
    const next = new URLSearchParams(location.search).get('next');
    const safeNext = next && /^\/app\/[\w.-]+\.html/.test(next) ? next : null;
    location.href = safeNext || body.redirect;
  } catch (e) {
    msg(esc((e && (e.detail?.message || e.detail)) || '登入失敗，請再試一次。'), 'err');
  }
}

$('do-login').onclick = () => submit('/auth/login');
$('do-register').onclick = () => submit('/auth/register');
['code', 'pw'].forEach(id =>
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') submit('/auth/login'); }));

(async () => {
  const params = new URLSearchParams(location.search);
  const lineError = params.get('line');
  if (lineError && LINE_ERRORS[lineError]) msg(LINE_ERRORS[lineError], 'warn');

  // 已經登入就不用再登一次
  try {
    const me = await (await fetch('/members/me', {credentials: 'same-origin'})).json();
    if (me.logged_in) {
      msg(`你已經登入了（${esc(me.code)}）。<a href="profile.html">看我的資料</a>`, 'ok');
    }
  } catch (e) {}

  // LINE 登入未設定時，不要留一顆按了沒反應的按鈕
  try {
    const s = await (await fetch('/members/line/status')).json();
    if (!s.configured) {
      $('line-box').innerHTML = `<div class="msg warn" style="margin:0">
        LINE 登入尚未設定，請先用下面的代號登入。<br>
        <span style="font-size:.9375rem">（管理者：在 .env 設定 LINE_LOGIN_CHANNEL_ID 與 LINE_LOGIN_CHANNEL_SECRET 後即可啟用）</span>
      </div>`;
    }
  } catch (e) {}
})();
</script>
</body>
</html>
