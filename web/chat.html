<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>說說你的狀況｜農民補給站</title>
<meta name="description" content="用一句話描述你的狀況（台語嘛通），幫你找出可以申請的補助；收到公文也可以貼上來翻成白話。">
<link rel="stylesheet" href="site-chat.css">
<style>
:root {
  --green-bright: #02DF82; --green-mid: #01B96B; --green-pale: #9FF5CF;
  --green-bg: #F0FDF6; --green-tint: #D9FBEC;
  --ink: #06301F; --ink-soft: #0A4A32;
  --orange: #D85A30; --warn-bg: #FEF3D8;
  --grad-main: linear-gradient(90deg, #02DF82, #00C9A7);
}
@font-face { font-family: 'GenSen'; src: url('fonts/GenSenRounded2TW-R.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'GenSen'; src: url('fonts/GenSenRounded2TW-M.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'GenSen'; src: url('fonts/GenSenRounded2TW-H.woff2') format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'GenSen'; src: url('fonts/GenSenRounded2TW-H.woff2') format('woff2'); font-weight: 900; font-display: swap; }

html { font-size: 16px; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'GenSen', 'Yuanti TC', 'Microsoft JhengHei', sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #D9FBEC 0%, #F2FEF8 30%, #FFFFFF 100%);
}
a { color: var(--green-mid); }
.page { min-height: 100vh; }

.demo-banner {
  background: var(--warn-bg); color: var(--ink); text-align: center;
  padding: 10px 16px; font-size: 1rem; font-weight: 500;
}
.nav-wrap { position: sticky; top: 12px; z-index: 50; display: flex; justify-content: center; padding: 12px 16px 0; }
.nav-pill {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
  border-radius: 999px; padding: 10px 14px 10px 22px;
  box-shadow: 0 8px 30px rgba(6,48,31,0.12); max-width: 960px; width: 100%;
}
.nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-weight: 900; font-size: 1.25rem; white-space: nowrap; }
.nav-links { display: flex; gap: 18px; flex-wrap: wrap; font-size: 1.0625rem; font-weight: 500; }
.nav-links a { text-decoration: none; color: var(--ink); white-space: nowrap; }
.nav-links a:hover, .nav-links a.current { color: var(--green-mid); }
.nav-spacer { flex: 1; }

main { max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
h1 { font-weight: 900; font-size: clamp(1.75rem, 5vw, 2.5rem); margin: 0 0 8px; text-align: center; }
.grad-text { background: var(--grad-main); -webkit-background-clip: text; background-clip: text; color: transparent; }
.page-sub { font-size: 1.1875rem; font-weight: 500; color: var(--ink-soft); margin: 0 0 24px; text-align: center; }

.tabs { display: flex; gap: 8px; margin: 0 0 16px; }
.tab {
  flex: 1; font-family: inherit; font-size: 1.1875rem; font-weight: 500;
  min-height: 56px; border: 2px solid var(--green-tint); background: #FFFFFF;
  color: var(--ink); border-radius: 12px 12px 0 0; cursor: pointer;
}
.tab.active { background: var(--green-bright); border-color: var(--green-bright); font-weight: 700; }

.doc-panel {
  background: #FFFFFF; border: 2px solid var(--green-tint); border-radius: 12px;
  padding: 20px; display: none; flex-direction: column; gap: 12px;
  box-shadow: 0 8px 30px rgba(6,48,31,0.10);
}
.doc-panel textarea {
  font-family: inherit; font-size: 1.125rem; line-height: 1.6;
  padding: 14px; min-height: 180px; resize: vertical;
  border: 2px solid var(--green-tint); border-radius: 10px; color: var(--ink);
}
.doc-panel textarea:focus { outline: 3px solid var(--green-pale); border-color: var(--green-mid); }
.doc-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-solid {
  font-family: inherit; font-size: 1.1875rem; font-weight: 500;
  min-height: 52px; padding: 8px 28px; border: none; border-radius: 10px;
  background: var(--green-bright); color: var(--ink); cursor: pointer;
}
.btn-solid:hover { background: var(--green-mid); }
.btn-disabled {
  font-family: inherit; font-size: 1.0625rem; font-weight: 500;
  min-height: 52px; padding: 8px 22px; border: 2px solid var(--green-tint);
  border-radius: 10px; background: var(--green-bg); color: #46564E; cursor: not-allowed;
}
.privacy-note { font-size: 1rem; color: var(--ink-soft); margin: 0; }
.doc-fine { font-size: 0.9375rem; color: #46564E; margin: 0; }
</style>
</head>
<body>
<div class="page">
  <div class="demo-banner">目前為示範資料，實際申請請洽農會或公所</div>

  <div class="nav-wrap">
    <nav class="nav-pill">
      <a href="index.html" class="nav-logo" aria-label="農民補給站首頁">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 2 v18" stroke="#06301F" stroke-width="2.5" stroke-linecap="round"/><path d="M4 3 L18 7 L4 11 Z" fill="#02DF82"/></svg>
        農民補給站
      </a>
      <div class="nav-links">
      <a href="browse.html">找補助</a>
      <a href="chat.html?tab=doc" class="current">看懂公文</a>
      <a href="index.html#guides">白話指南</a>
      <a href="profile.html">我的資料</a>
      <a href="dashboard.html">卡點儀表板</a>
      <a href="login.html">登入</a>
    </div>
      <div class="nav-spacer"></div>
    </nav>
  </div>

  <main>
    <h1>說說<span class="grad-text">你的狀況</span></h1>
    <p class="page-sub">一句話就好，台語嘛通。我一次只問一題，慢慢來。</p>

    <div class="tabs" role="tablist">
      <button class="tab active" id="tab-ask" role="tab">我要問補助</button>
      <button class="tab" id="tab-doc" role="tab">我收到公文</button>
    </div>

    <div id="chat-holder"></div>

    <div class="doc-panel" id="doc-panel">
      <textarea id="doctext" placeholder="把公文的文字整段貼在這裡；或直接按下面「拍照上傳」"></textarea>
      <div class="doc-actions">
        <button class="btn-solid" id="doc-send">翻成白話</button>
        <button class="btn-solid" id="doc-photo">拍照上傳</button>
        <input type="file" id="doc-file" accept="image/*" capture="environment" hidden>
      </div>
      <p class="privacy-note">照片與文字會傳送至 Anthropic API 辨識；本站不另行儲存，Anthropic 可能暫存最長 30 天（<a href="https://privacy.anthropic.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data" target="_blank" rel="noopener">資料政策</a>）。</p>
      <p class="doc-fine">翻譯僅供參考，日期不確定時請以電話向承辦確認。</p>
    </div>
  </main>
</div>

<script src="site-chat.js"></script>
<script>
(function () {
  const holder = document.getElementById('chat-holder');
  const docPanel = document.getElementById('doc-panel');
  const tabAsk = document.getElementById('tab-ask');
  const tabDoc = document.getElementById('tab-doc');

  const widget = AidChat.init(holder, {
    greeting: '你好！我是農民補給站。\n遇到災損、想查補助，用一句話告訴我就好，台語嘛通。\n收到看不懂的公文，點上面「我收到公文」，拍照或貼文字都可以。'
  });

  function switchTab(which) {
    tabAsk.classList.toggle('active', which === 'ask');
    tabDoc.classList.toggle('active', which === 'doc');
    holder.style.display = which === 'ask' ? '' : 'none';
    docPanel.style.display = which === 'doc' ? 'flex' : 'none';
  }
  tabAsk.onclick = () => switchTab('ask');
  tabDoc.onclick = () => switchTab('doc');

  document.getElementById('doc-send').onclick = () => {
    const ta = document.getElementById('doctext');
    const t = ta.value.trim();
    if (!t) return;
    ta.value = '';
    switchTab('ask');
    widget.sendDocument(t);
  };

  const fileInput = document.getElementById('doc-file');
  document.getElementById('doc-photo').onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';           // 同一張再選一次也要能觸發
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      alert('照片太大了（超過 5MB），請用手機相機一般畫質重拍。');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      switchTab('ask');
      widget.sendDocumentImage(reader.result);   // data URL，後端會拆前綴
    };
    reader.onerror = () => alert('照片讀取失敗，請再試一次。');
    reader.readAsDataURL(file);
  };

  if (new URLSearchParams(location.search).get('tab') === 'doc') switchTab('doc');
})();
</script>
</body>
</html>
