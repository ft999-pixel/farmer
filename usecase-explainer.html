<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farmer Aid Station — Use-Situation Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7FBF8;
  --bg2:#EAF6EE;
  --card:#ffffff;
  --teal:#02DF82;
  --teal-soft:rgba(2,223,130,0.10);
  --coral:#D85A30;
  --coral-soft:rgba(216,90,48,0.10);
  --navy:#06301F;
  --text:#06301F;
  --muted:rgba(6,48,31,0.70);
  --border:rgba(6,48,31,0.08);
  --shadow:0 2px 20px rgba(6,48,31,0.06);
  --font-heading:'Chiron GoRound TC','Instrument Serif',sans-serif;
  --font-body:'Chiron GoRound TC',sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(1200px 800px at 20% 10%,var(--bg2),var(--bg) 60%);
  color:var(--text);font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}

/* ============ AMBIENT ============ */
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.pt{position:absolute;border-radius:50%;background:var(--teal);opacity:.18;animation:drift linear infinite}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1);opacity:.05}
  50%{opacity:.22}
  100%{transform:translate3d(var(--dx),var(--dy),0) scale(1.4);opacity:.03}
}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.blob.a{width:46vw;height:46vw;background:var(--teal-soft);left:-10vw;top:-8vw;animation:blobA 34s ease-in-out infinite}
.blob.b{width:38vw;height:38vw;background:var(--coral-soft);right:-8vw;bottom:-10vw;animation:blobB 42s ease-in-out infinite}
@keyframes blobA{0%,100%{transform:translate(0,0)}50%{transform:translate(6vw,5vh)}}
@keyframes blobB{0%,100%{transform:translate(0,0)}50%{transform:translate(-7vw,-4vh)}}
#sceneFlash{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(2,223,130,.30),transparent 62%)}
#sceneFlash.fire{animation:flash .85s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

/* ============ DAY COUNTER ============ */
#day{position:fixed;top:20px;right:24px;z-index:6;font-family:var(--font-mono);
  font-size:12px;letter-spacing:.16em;color:var(--muted);opacity:0;transition:opacity .6s ease}
#day.on{opacity:1}
#day .n{color:var(--navy);font-weight:500}
#day .paid{color:var(--teal);margin-left:8px}
#day.flip .n{animation:flipn .5s ease}
@keyframes flipn{0%{transform:translateY(0);opacity:1}45%{transform:translateY(-10px);opacity:0}55%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ============ STAGE ============ */
#stage{position:fixed;left:0;right:0;top:0;bottom:44px;perspective:1800px;z-index:2;overflow:hidden}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 5vw 26px;text-align:center;transform-style:preserve-3d;
  opacity:0;transform:translateZ(-260px) scale(.95);pointer-events:none;
  transition:opacity .85s cubic-bezier(.22,.61,.36,1),transform .85s cubic-bezier(.22,.61,.36,1)}
.scene.active{opacity:1;transform:none}
.scene.zoom-out{opacity:0;transform:translateZ(340px) scale(1.08)}

[data-at]{opacity:0;transform:translateY(18px);
  transition:opacity .75s ease,transform .75s cubic-bezier(.22,.61,.36,1)}
[data-at].lit{opacity:1;transform:none}
[data-at].keep{transform:none}

/* ============ TEXT ============ */
.subtitle{font-family:var(--font-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--teal);margin-bottom:14px;font-weight:500}
.subtitle::before{content:'';display:inline-block;width:22px;height:1px;background:var(--teal);
  vertical-align:middle;margin-right:10px;opacity:.6}
.title{font-family:var(--font-heading);font-weight:900;color:var(--navy);
  font-size:clamp(28px,4.4vw,54px);line-height:1.18;letter-spacing:-.01em;max-width:16ch;margin:0 auto}
.title.wide{max-width:22ch}
.hl{color:var(--teal);position:relative}
.note{font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--muted);
  max-width:640px;margin:20px auto 0}
.note code{font-family:var(--font-mono);font-size:12px;background:var(--teal-soft);
  color:var(--navy);padding:2px 7px;border-radius:6px}
.zh{font-family:var(--font-body);color:var(--navy)}
.en{display:block;font-size:.72em;color:var(--muted);font-weight:400;margin-top:3px}

.disclaim{position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:var(--muted);
  font-family:var(--font-body);letter-spacing:.02em}
.disclaim b{font-weight:500;color:var(--navy)}

/* ============ SHARED PIECES ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:16px 20px;text-align:left}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;
  font-size:12px;font-family:var(--font-mono);font-weight:500}
.pill.deadline{background:var(--coral-soft);color:var(--coral);animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
.btn-big{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:var(--navy);
  font-weight:500;font-size:15px;padding:12px 22px;border-radius:14px;
  box-shadow:0 0 0 0 rgba(2,223,130,.5);animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(2,223,130,.45)}70%{box-shadow:0 0 0 16px rgba(2,223,130,0)}100%{box-shadow:0 0 0 0 rgba(2,223,130,0)}}

/* ============ S01 orchard ============ */
.orchard{position:relative;width:min(880px,92vw);height:min(300px,36vh);
  transform-style:preserve-3d;margin-bottom:26px}
.ridge{position:absolute;left:-6%;right:-6%;bottom:38%;height:70px;
  background:linear-gradient(180deg,rgba(6,48,31,.10),rgba(6,48,31,.03));
  clip-path:polygon(0 100%,8% 46%,20% 72%,33% 30%,47% 66%,60% 38%,74% 70%,88% 44%,100% 82%,100% 100%);
  transform:translateZ(-400px) scale(1.5);animation:pan 26s linear infinite alternate}
@keyframes pan{0%{transform:translateZ(-400px) scale(1.5) translateX(-2%)}100%{transform:translateZ(-400px) scale(1.5) translateX(2%)}}
.tree{position:absolute;bottom:30%;width:64px;height:88px;transform-origin:50% 100%;
  background:radial-gradient(circle at 50% 35%,rgba(6,48,31,.34),rgba(6,48,31,.16) 62%,transparent 70%);
  border-radius:50% 50% 44% 44%;animation:sway 8s ease-in-out infinite}
.tree::after{content:'';position:absolute;left:50%;bottom:-14px;width:5px;height:20px;
  margin-left:-2.5px;background:rgba(6,48,31,.3);border-radius:2px}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.mango{position:absolute;width:26px;height:20px;border-radius:52% 52% 48% 48%;
  background:linear-gradient(140deg,#F2C14E,#D8873A);box-shadow:0 6px 14px rgba(6,48,31,.18);
  animation:bob 6s ease-in-out infinite}
.mango::after{content:'';position:absolute;top:-4px;left:60%;width:2px;height:6px;background:rgba(6,48,31,.4);border-radius:2px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-4px) rotate(var(--r,0deg))}}

/* ============ S02 program wall ============ */
.wall{position:relative;width:min(900px,94vw);height:min(320px,38vh);transform-style:preserve-3d;
  animation:wallturn 16s ease-in-out infinite alternate;margin-bottom:22px}
@keyframes wallturn{0%{transform:rotateY(-3deg)}100%{transform:rotateY(3deg)}}
.pchip{position:absolute;left:50%;top:50%;padding:8px 14px;border-radius:10px;background:var(--card);
  border:1px solid var(--border);box-shadow:var(--shadow);font-size:12px;color:var(--navy);
  white-space:nowrap;transform-style:preserve-3d}
.pchip.fuzzy{color:transparent;text-shadow:0 0 7px rgba(6,48,31,.45)}
.reach{position:absolute;left:50%;bottom:-6%;width:120px;height:150px;margin-left:-140px;
  border-radius:60px 60px 26px 26px;background:linear-gradient(180deg,rgba(6,48,31,.16),rgba(6,48,31,.04));
  transform:rotate(-14deg);animation:reachy 5s ease-in-out infinite}
@keyframes reachy{0%,100%{transform:rotate(-14deg) translateY(6px)}50%{transform:rotate(-11deg) translateY(0)}}
.calpage{position:absolute;right:6%;top:8%;width:74px;height:88px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);
  font-size:11px;color:var(--coral);letter-spacing:.1em;animation:tearoff 3.4s ease-in-out infinite}
@keyframes tearoff{0%{transform:rotateX(0) translateY(0);opacity:1}
  60%{transform:rotateX(-72deg) translateY(-40px);opacity:0}
  61%,100%{transform:rotateX(0) translateY(0);opacity:1}}

/* ============ S03 bubble ============ */
.bubble{position:relative;width:min(620px,90vw);padding:30px 34px 26px;border-radius:28px;
  background:var(--card);border:2px solid var(--teal);box-shadow:0 18px 46px rgba(6,48,31,.10);
  transform:rotateX(-6deg);animation:float6 5s ease-in-out infinite;margin-bottom:24px}
@keyframes float6{0%,100%{transform:rotateX(-6deg) translateY(0)}50%{transform:rotateX(-6deg) translateY(-7px)}}
.bubble::after{content:'';position:absolute;left:56px;bottom:-16px;width:30px;height:30px;
  background:var(--card);border-right:2px solid var(--teal);border-bottom:2px solid var(--teal);
  transform:rotate(45deg);border-radius:0 0 6px 0}
.wave{display:flex;align-items:flex-end;gap:5px;height:34px;justify-content:center;margin-bottom:16px}
.wave i{width:5px;background:var(--teal);border-radius:3px;animation:bar 1.2s linear infinite}
@keyframes bar{0%,100%{height:8px}50%{height:32px}}
.say{font-family:var(--font-heading);font-weight:700;font-size:clamp(26px,3.6vw,44px);color:var(--navy);letter-spacing:.02em}
.sayen{font-size:15px;color:var(--muted);margin-top:8px}

/* ============ S04/S05 facts ============ */
.facts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:26px}
.fchip{padding:10px 18px;border-radius:12px;font-family:var(--font-mono);font-size:13px;
  background:var(--card);border:1.5px solid var(--teal);color:var(--navy);box-shadow:var(--shadow)}
.fchip.blank{border-style:dashed;border-color:rgba(6,48,31,.28);color:var(--muted);
  animation:pulseblank 1.6s ease-in-out infinite}
@keyframes pulseblank{0%,100%{border-color:rgba(6,48,31,.20);opacity:.72}50%{border-color:var(--teal);opacity:1}}
.qwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.thread{width:2px;height:44px;background:linear-gradient(180deg,transparent,var(--teal));
  position:relative;overflow:hidden}
.thread::after{content:'';position:absolute;left:-1px;width:4px;height:14px;background:var(--teal);
  filter:blur(2px);animation:flow 1.6s linear infinite}
@keyframes flow{0%{top:100%}100%{top:-20%}}
.qcard{width:min(560px,92vw);padding:24px 26px;border-radius:20px;background:var(--card);
  border:1px solid var(--border);box-shadow:0 14px 40px rgba(6,48,31,.09);transform:rotateX(-9deg)}
.qtext{font-family:var(--font-heading);font-weight:700;font-size:26px;color:var(--navy)}
.qopts{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.qopt{padding:12px 22px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);
  font-size:16px;color:var(--navy)}
.qopt.pick{background:var(--teal);border-color:var(--teal);font-weight:500}
.dots{display:flex;gap:7px;justify-content:center;margin-top:18px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.dots i.empty{background:transparent;border:1.5px solid rgba(6,48,31,.25);animation:pulseblank 1.8s ease-in-out infinite}
.dots span{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:8px}

/* ============ S06 tiers ============ */
.shelf{width:min(880px,94vw);display:flex;flex-direction:column;gap:12px;margin-bottom:18px;transform-style:preserve-3d}
.tier{border-radius:18px;padding:14px 18px;background:var(--card);border:1px solid var(--border);
  box-shadow:var(--shadow);transform:rotateX(-8deg);text-align:left;animation:tierfloat 7s ease-in-out infinite}
.tier.t1{border:2px solid var(--teal);animation-delay:0s}
.tier.t2{animation-delay:.4s}
.tier.t3{background:rgba(6,48,31,.035);animation-delay:.8s}
@keyframes tierfloat{0%,100%{transform:rotateX(-8deg) translateY(0)}50%{transform:rotateX(-8deg) translateY(-5px)}}
.tier-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tier-name{font-weight:700;font-size:17px;color:var(--navy)}
.tier-name em{font-style:normal;display:block;font-size:11px;color:var(--muted);font-weight:400;
  font-family:var(--font-mono);letter-spacing:.06em;margin-top:2px}
.mini{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini span{flex:1;min-width:90px;height:34px;border-radius:9px;background:var(--bg2);border:1px solid var(--border)}
.tier.t1 .mini span{background:var(--teal-soft);border-color:rgba(2,223,130,.35)}
.expand{font-family:var(--font-mono);font-size:11px;color:var(--muted)}

/* ============ S07 priority card ============ */
.big-card{width:min(620px,94vw);padding:24px 26px;border-radius:22px;background:var(--card);
  border:2px solid var(--teal);box-shadow:0 22px 54px rgba(6,48,31,.12);text-align:left;transform:rotateX(-4deg)}
.bc-title{font-family:var(--font-heading);font-weight:900;font-size:23px;color:var(--navy);line-height:1.3}
.why{margin-top:10px;font-size:13px;color:var(--navy);background:var(--teal-soft);
  border-radius:10px;padding:8px 12px}
.why em{font-style:normal;color:var(--muted);display:block;font-size:11px;margin-top:2px;font-family:var(--font-mono)}
.docs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.docs div{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--navy)}
.tick{width:19px;height:19px;border-radius:6px;background:var(--teal);color:var(--navy);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.bc-foot{margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.office{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.basis{margin-top:12px;display:inline-block;font-family:var(--font-mono);font-size:10.5px;
  color:var(--muted);border:1px dashed var(--border);border-radius:8px;padding:4px 10px}

/* ============ S08 skip ============ */
.skips{width:min(820px,94vw);display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.skip{padding:12px 16px;border-radius:14px;background:rgba(6,48,31,.04);border:1px solid var(--border);
  text-align:left;font-size:14px;color:var(--muted);animation:tierfloat 8s ease-in-out infinite}
.skip b{color:var(--navy);font-weight:500}
.skip.up{background:var(--card);box-shadow:var(--shadow);transform:translateZ(30px)}
.exit{margin-top:6px;position:relative;display:inline-block;font-size:15px;color:var(--navy);font-weight:500}
.exit::after{content:'';position:absolute;left:0;bottom:-5px;height:2px;width:100%;background:var(--teal);
  transform-origin:left;animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%{transform:scaleX(0)}45%{transform:scaleX(1)}80%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:right}}

/* ============ S09/S10/S11 document ============ */
.docstage{position:relative;width:min(760px,94vw);height:min(320px,38vh);transform-style:preserve-3d;margin-bottom:20px}
.envelope{position:absolute;left:50%;top:8%;width:190px;height:120px;margin-left:-95px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);
  transform:rotateY(28deg) rotateX(-12deg)}
.envelope::after{content:'';position:absolute;inset:0;border-top:56px solid rgba(6,48,31,.06);
  border-left:95px solid transparent;border-right:95px solid transparent;box-sizing:border-box}
.paper{position:absolute;left:50%;top:12%;width:min(430px,72vw);height:min(240px,30vh);margin-left:calc(min(430px,72vw)/-2);
  background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 44px rgba(6,48,31,.12);
  padding:20px 22px;overflow:hidden;transform:rotateX(-20deg);animation:papertilt 7s ease-in-out infinite}
@keyframes papertilt{0%,100%{transform:rotateX(-20deg) rotateZ(-1deg)}50%{transform:rotateX(-16deg) rotateZ(1deg)}}
.blurline{height:9px;border-radius:4px;background:rgba(6,48,31,.22);margin-bottom:9px;filter:blur(2.4px)}
.sharp{font-size:15px;font-weight:700;color:var(--coral);letter-spacing:.04em;
  background:var(--coral-soft);display:inline-block;padding:3px 10px;border-radius:7px;
  filter:none;animation:blink 2.5s ease-in-out infinite;margin:6px 0 9px}
@keyframes blink{0%,100%{opacity:.6}50%{opacity:1}}
.phone{position:absolute;left:50%;top:2%;width:150px;height:270px;margin-left:-75px;
  border-radius:24px;background:var(--navy);border:5px solid var(--navy);box-shadow:0 26px 60px rgba(6,48,31,.28);
  transform:rotateY(-20deg) rotateX(6deg);animation:float8 4s ease-in-out infinite;overflow:hidden}
@keyframes float8{0%,100%{transform:rotateY(-20deg) rotateX(6deg) translateY(0)}50%{transform:rotateY(-20deg) rotateX(6deg) translateY(-9px)}}
.phone .screen{position:absolute;inset:0;background:var(--bg);border-radius:19px;padding:14px 12px}
.focusbox{position:absolute;inset:26px 16px;border:2px solid var(--teal);border-radius:8px;
  animation:focusin 3s ease-in-out infinite}
@keyframes focusin{0%{inset:14px 6px;opacity:.4}55%{inset:28px 18px;opacity:1}100%{inset:28px 18px;opacity:1}}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--teal);
  box-shadow:0 0 18px 5px rgba(2,223,130,.55);animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.ba{display:flex;gap:18px;align-items:center;justify-content:center;width:min(880px,94vw);
  transform-style:preserve-3d;margin-bottom:18px;flex-wrap:wrap}
.before{width:min(300px,42vw);padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);
  transform:rotateY(22deg) translateZ(-90px);filter:blur(1.6px);opacity:.72;animation:sink 9s ease-in-out infinite}
@keyframes sink{0%,100%{transform:rotateY(22deg) translateZ(-90px) translateY(0)}50%{transform:rotateY(22deg) translateZ(-110px) translateY(8px)}}
.after{width:min(400px,54vw);padding:20px;border-radius:18px;background:var(--card);border:2px solid var(--teal);
  box-shadow:0 20px 50px rgba(6,48,31,.12);transform:rotateY(-10deg) translateZ(50px);text-align:left}
.after .line{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--navy);margin-bottom:11px}
.after .line b{color:var(--teal);font-family:var(--font-mono);font-size:12px;padding-top:3px}
.after .ask{background:var(--teal-soft);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--navy)}
.answer{display:inline-block;margin-top:10px;font-family:var(--font-mono);font-size:12px;
  background:var(--navy);color:var(--bg);padding:5px 12px;border-radius:8px}

/* ============ S12 stuck ============ */
.spot{position:relative;width:min(760px,94vw);height:min(300px,36vh);display:grid;place-items:center;transform-style:preserve-3d}
.form-ghost{position:absolute;inset:0;border-radius:18px;background:rgba(6,48,31,.05);
  border:1px dashed var(--border);padding:22px;opacity:.6}
.form-ghost i{display:block;height:10px;border-radius:4px;background:rgba(6,48,31,.13);margin-bottom:12px}
.form-ghost i:nth-child(4){width:40%}
.form-ghost i:nth-child(5),.form-ghost i:nth-child(6){opacity:.35}
.stuckbtn{position:relative;z-index:2;transform:translateZ(80px);
  background:var(--teal);color:var(--navy);font-family:var(--font-heading);font-weight:900;
  font-size:clamp(24px,3.4vw,38px);padding:20px 42px;border-radius:22px;
  box-shadow:0 22px 60px rgba(2,223,130,.34);animation:halo 2.4s ease-out infinite}
.stuckbtn em{display:block;font-style:normal;font-family:var(--font-mono);font-size:12px;
  font-weight:400;letter-spacing:.1em;margin-top:6px;opacity:.72}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}

      <div class="blabel" data-at="3" style="margin-top:14px;color:var(--navy)">卡點統計 · where people quit</div>
      <div class="bars" data-at="3.8">
        <div><span style="width:64%"></span>太麻煩 41%</div>
        <div><span style="width:48%"></span>文件生不出來 33%</div>
        <div><span style="width:34%"></span>看不懂 26%</div>
      </div>
    </div>
  </div>
  <p class="note" data-at="4.6">Every abandonment used to be silence. Now it is anonymous data, pointed at the exact step that failed.</p>
  <div class="disclaim" data-at="5.2">實際資格由承辦單位認定 · <b>Final eligibility is determined by the responsible agency.</b></div>
`},
/* 14 */ {start:80, end:85, html:`
  <div class="orbit keep" data-at="0">
    <i style="--r:220px;animation-delay:0s"></i><i style="--r:270px;animation-delay:-3s"></i>
    <i style="--r:190px;animation-delay:-6s"></i><i style="--r:310px;animation-delay:-9s"></i>
    <i style="--r:240px;animation-delay:-12s"></i><i style="--r:290px;animation-delay:-15s"></i>
    <i style="--r:200px;animation-delay:-18s"></i><i style="--r:330px;animation-delay:-21s"></i>
  </div>
  <div class="extruded" data-at="1.8">農民補給站</div>
  <div class="slogan" data-at="2.8">甲你鬥相共</div>
  <div class="sub-en" data-at="3.4">Farmer Aid Station — plain answers, on the farmer's side.</div>
  <div class="disclaim" data-at="4.2">實際資格由承辦單位認定 · <b>Final eligibility is determined by the responsible agency.</b></div>
`}
];

const subs = [
  {s:0.5,e:3.5,t:"The typhoon passed at three in the morning."},
  {s:3.5,e:7,t:"By sunrise, the relief programs were already open."},
  {s:7,e:10.5,t:"Forty-one programs. Eight agencies. Zero of them will call him."},
  {s:10.5,e:14,t:"And one of them closes in nine days."},
  {s:14,e:17,t:"He doesn't search. He doesn't filter."},
  {s:17,e:20,t:"He says one sentence, in the language he actually speaks."},
  {s:20,e:23,t:"The sentence becomes structured facts."},
  {s:23,e:26,t:"Two of them come back blank. That is not a failure."},
  {s:26,e:29,t:"Whatever is missing becomes the next question."},
  {s:29,e:32,t:"One at a time. Three to five, and it is done."},
  {s:32,e:35.5,t:"Not “you qualify.” Not “you don't.”"},
  {s:35.5,e:39,t:"Three shelves: look at these first, these might apply, skip these."},
  {s:39,e:42.5,t:"Every card says why it is there."},
  {s:42.5,e:46,t:"Which documents. Which desk. Which phone number. How many days left."},
  {s:46,e:49,t:"The ones it sets aside still tell him why."},
  {s:49,e:52,t:"And it never closes the door — a phone call is still the surest answer."},
  {s:52,e:55,t:"Four days later, a letter arrives."},
  {s:55,e:58,t:"One line in it is sharp. The rest may as well be a wall."},
  {s:58,e:61,t:"He photographs it. That is the entire interaction."},
  {s:61,e:64,t:"Text goes in. Plain words come back."},
  {s:64,e:66,t:"“Within fifteen days of receipt” — of which receipt?"},
  {s:66,e:68,t:"So it asks him first, then starts counting."},
  {s:68,e:71,t:"Somewhere in the paperwork, he stalls."},
  {s:71,e:74,t:"One tap. Three honest options."},
  {s:74,e:77,t:"To him: other programs, easier ones."},
  {s:77,e:80,t:"To the map: the first record of where people actually quit."},
  {s:80,e:83,t:"Day 14. The money is in."},
  {s:83,e:85,t:"Farmer Aid Station — plain answers, on the farmer's side."}
];

/* ---------- build ---------- */
const stage = document.getElementById('stage');
const els = scenes.map(sc=>{
  const d = document.createElement('section');
  d.className = 'scene';
  d.innerHTML = sc.html;
  stage.appendChild(d);
  return d;
});

const amb = document.getElementById('ambient');
for(let i=0;i<18;i++){
  const p = document.createElement('div');
  p.className='pt';
  const sz = 3+Math.random()*7;
  p.style.width=sz+'px'; p.style.height=sz+'px';
  p.style.left=(Math.random()*100)+'%';
  p.style.top=(Math.random()*100)+'%';
  p.style.setProperty('--dx',(Math.random()*160-80)+'px');
  p.style.setProperty('--dy',(-60-Math.random()*180)+'px');
  p.style.animationDuration=(16+Math.random()*22)+'s';
  p.style.animationDelay=(-Math.random()*30)+'s';
  amb.appendChild(p);
}

const prog=document.getElementById('prog'), fill=document.getElementById('fill');
scenes.forEach((sc,i)=>{
  if(i===0) return;
  const dot=document.createElement('div');
  dot.className='dot';
  dot.style.left=(sc.start/TOTAL*100)+'%';
  dot.dataset.i=i;
  prog.appendChild(dot);
});
const dots=[...prog.querySelectorAll('.dot')];

/* ---------- state ---------- */
let t=0, playing=true, last=performance.now(), cur=-1, capText='';
const cap=document.getElementById('cap'), timeEl=document.getElementById('time');
const flash=document.getElementById('sceneFlash');
const dayEl=document.getElementById('day'), dayN=dayEl.querySelector('.n'), paidEl=document.getElementById('paid');
let lastDay='';

const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function sceneAt(time){
  for(let i=scenes.length-1;i>=0;i--) if(time>=scenes[i].start) return i;
  return 0;
}

function setScene(i){
  if(i===cur) return;
  if(cur>=0){ els[cur].classList.remove('active'); els[cur].classList.add('zoom-out');
    const old=cur; setTimeout(()=>els[old].classList.remove('zoom-out'),900); }
  cur=i;
  els[i].querySelectorAll('[data-at]').forEach(e=>e.classList.remove('lit'));
  els[i].classList.remove('zoom-out');
  els[i].classList.add('active');
  flash.classList.remove('fire'); void flash.offsetWidth; flash.classList.add('fire');
  dots.forEach(d=>{ const di=+d.dataset.i;
    d.classList.toggle('past', di<=i);
    d.classList.toggle('next', di===i+1); });
}

function dayFor(time){
  if(time<6) return '';
  if(time<52) return 'DAY 1';
  if(time<68) return 'DAY 5';
  if(time<80.8) return 'DAY 9';
  return 'DAY 14';
}

function tick(now){
  const dt=(now-last)/1000; last=now;
  if(playing){ t+=dt; if(t>=TOTAL){ t=TOTAL; playing=false; document.getElementById('play').classList.remove('on'); } }

  const i=sceneAt(t);
  setScene(i);

  const rel=t-scenes[i].start;
  els[i].querySelectorAll('[data-at]').forEach(e=>{
    if(rel >= parseFloat(e.dataset.at)) e.classList.add('lit');
    else e.classList.remove('lit');
  });

  const s=subs.find(x=>t>=x.s&&t<x.e);
  const txt=s?s.t:'';
  if(txt!==capText){ capText=txt; cap.textContent=txt;
    cap.classList.remove('cap-in'); void cap.offsetWidth; cap.classList.add('cap-in'); }

  const d=dayFor(t);
  if(d!==lastDay){
    lastDay=d;
    dayEl.classList.toggle('on', !!d);
    if(d){ dayN.textContent=d; dayEl.classList.remove('flip'); void dayEl.offsetWidth; dayEl.classList.add('flip'); }
    paidEl.style.display = (d==='DAY 14') ? 'inline' : 'none';
  }

  fill.style.width=(t/TOTAL*100)+'%';
  timeEl.textContent=fmt(t)+' / '+fmt(TOTAL);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- controls ---------- */
const playBtn=document.getElementById('play');
function toggle(){ if(t>=TOTAL) t=0; playing=!playing; playBtn.classList.toggle('on',playing); playBtn.textContent=playing?'❚❚':'▶'; }
playBtn.onclick=toggle;
playBtn.textContent='❚❚';
document.getElementById('prev').onclick=()=>{ const i=sceneAt(t); t = (t-scenes[i].start<1.2 && i>0) ? scenes[i-1].start : scenes[i].start; cur=-1; setScene(sceneAt(t)); };
document.getElementById('next').onclick=()=>{ const i=sceneAt(t); if(i<scenes.length-1) t=scenes[i+1].start; else t=TOTAL; };
prog.onclick=e=>{ const r=prog.getBoundingClientRect(); t=Math.min(TOTAL,Math.max(0,(e.clientX-r.left)/r.width*TOTAL)); cur=-1; setScene(sceneAt(t)); };
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='ArrowLeft'){e.preventDefault();document.getElementById('prev').click();}
  if(e.code==='ArrowRight'){e.preventDefault();document.getElementById('next').click();}
});
let sx=null;
addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)<56) return;
  document.getElementById(dx<0?'next':'prev').click();
},{passive:true});
</script>
</body>
</html>
