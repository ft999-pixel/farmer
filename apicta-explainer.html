<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Aid Station — Animated Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;900&family=Instrument+Serif&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F9F7F7;
  --bg2:#EEF1F7;
  --card:#fff;
  --teal:#3F72AF;
  --teal-soft:rgba(63,114,175,0.08);
  --coral:#E07A5F;
  --coral-soft:rgba(224,122,95,0.08);
  --navy:#112D4E;
  --text:#112D4E;
  --muted:rgba(17,45,78,0.7);
  --border:rgba(17,45,78,0.08);
  --shadow:0 2px 20px rgba(17,45,78,0.06);
  --font-heading:'Chiron GoRound TC','Instrument Serif',sans-serif;
  --font-body:'Chiron GoRound TC',sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  font-family:var(--font-body);
  color:var(--text);
  overflow:hidden;
}

/* ===== AMBIENT LAYER ===== */
.bgshape{position:fixed;width:55vw;height:55vw;border-radius:50%;filter:blur(90px);opacity:.6;pointer-events:none;z-index:0;}
#bg1{background:var(--teal-soft);top:-18vw;left:-14vw;animation:sway1 26s ease-in-out infinite alternate;}
#bg2{background:var(--coral-soft);bottom:-22vw;right:-14vw;animation:sway2 32s ease-in-out infinite alternate;}
@keyframes sway1{from{transform:translate(0,0) scale(1);}to{transform:translate(6vw,4vw) scale(1.12);}}
@keyframes sway2{from{transform:translate(0,0) scale(1.1);}to{transform:translate(-5vw,-5vw) scale(1);}}
.particle{position:fixed;border-radius:50%;pointer-events:none;bottom:-4vh;z-index:1;animation:drift linear infinite;}
@keyframes drift{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  10%{opacity:.9;}
  90%{opacity:.9;}
  100%{transform:translateY(-108vh) translateX(4vw);opacity:0;}
}
#sceneFlash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(63,114,175,.16),transparent 62%);}
#sceneFlash.fire{animation:flashfx .8s ease-out;}
@keyframes flashfx{0%{opacity:1;}100%{opacity:0;}}

/* ===== STAGE + SCENES ===== */
#stage{position:fixed;left:0;right:0;top:0;bottom:44px;perspective:1800px;overflow:hidden;z-index:2;}
.scene{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:28px 20px;text-align:center;opacity:0;pointer-events:none;
  transform:scale(.94) translateY(24px);
  transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1);
}
.scene.active{opacity:1;transform:none;pointer-events:auto;}
.scene.zoom-out{opacity:0;transform:scale(1.07);}
[data-at]{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease;}
[data-at].shown{opacity:1;transform:none;}

.subtitle{font-family:var(--font-mono);color:var(--teal);text-transform:uppercase;letter-spacing:.28em;font-size:12px;}
.title{font-family:var(--font-heading);color:var(--navy);font-weight:900;font-size:clamp(28px,5vw,52px);line-height:1.15;}
.title .hl{color:var(--teal);}
.note{color:var(--muted);max-width:640px;font-size:15px;line-height:1.75;}
.note code{background:var(--teal-soft);color:var(--teal);padding:2px 8px;border-radius:6px;font-family:var(--font-mono);font-size:12.5px;}

/* ===== SCENE 1 : stacked parallax documents ===== */
.docstack{position:relative;width:min(340px,72vw);height:225px;transform-style:preserve-3d;animation:docSway 7s ease-in-out infinite;margin:14px 0 34px;}
@keyframes docSway{0%,100%{transform:rotateY(-9deg) rotateX(4deg);}50%{transform:rotateY(9deg) rotateX(4deg);}}
.doc{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px 18px;text-align:left;}
.doc.d1{transform:rotateX(14deg) rotateZ(-4deg) translateZ(0);}
.doc.d2{transform:rotateX(14deg) rotateZ(-1deg) translateZ(36px);}
.doc.d3{transform:rotateX(14deg) rotateZ(2.5deg) translateZ(72px);}
.docline{height:9px;border-radius:5px;background:var(--bg2);margin:10px 0;filter:blur(2.5px);}
.stamp{position:absolute;top:12px;right:14px;font-family:var(--font-mono);color:var(--coral);border:2px solid var(--coral);border-radius:8px;padding:2px 9px;transform:rotate(8deg);font-size:12px;letter-spacing:.1em;}
.duecard{position:absolute;right:-30px;bottom:-26px;transform:translateZ(95px) rotateZ(5deg);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:9px 14px;font-family:var(--font-mono);font-size:11px;color:var(--coral);animation:duePulse 2.2s ease-in-out infinite;}
@keyframes duePulse{0%,100%{box-shadow:0 0 0 0 rgba(224,122,95,.3);}50%{box-shadow:0 0 0 9px rgba(224,122,95,0);}}

/* ===== SCENE 2 : floating phone + z-arc tier cards ===== */
.solwrap{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;transform-style:preserve-3d;margin:6px 0;}
.phone{width:176px;height:330px;border-radius:28px;background:var(--navy);padding:8px;box-shadow:var(--shadow);transform:rotateY(15deg) rotateX(4deg);animation:phoneFloat 5.5s ease-in-out infinite;}
@keyframes phoneFloat{0%,100%{transform:rotateY(15deg) rotateX(4deg) translateY(0);}50%{transform:rotateY(11deg) rotateX(2deg) translateY(-12px);}}
.screen{background:var(--bg);width:100%;height:100%;border-radius:21px;padding:12px 10px;display:flex;flex-direction:column;gap:9px;overflow:hidden;}
.bub{max-width:88%;padding:8px 11px;border-radius:13px;font-size:11px;line-height:1.45;text-align:left;}
.bub.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px;}
.bub.bot{align-self:flex-start;background:var(--card);border:1px solid var(--border);color:var(--navy);border-bottom-left-radius:4px;}
.tiers{display:flex;flex-direction:column;gap:13px;transform-style:preserve-3d;}
.tier{width:238px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:12px;padding:11px 15px;text-align:left;box-shadow:var(--shadow);animation:tierBob 4.5s ease-in-out infinite;}
.tier .tl{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--muted);}
.tier b{display:block;font-size:14px;color:var(--navy);margin:3px 0 2px;}
.tier small{font-size:11.5px;color:var(--muted);}
.tier.t1{transform:translateZ(64px);border-left-color:var(--teal);}
.tier.t2{transform:translateZ(32px);border-left-color:var(--coral);animation-delay:.5s;}
.tier.t3{transform:translateZ(0);opacity:.78;border-left-color:rgba(17,45,78,.2);animation-delay:1s;}
@keyframes tierBob{0%,100%{translate:0 0;}50%{translate:0 -7px;}}
.disclaim{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;}

/* ===== SCENE 3 : orbiting loop + pulsing button ===== */
.orbit{position:relative;width:min(300px,74vw);height:min(300px,74vw);margin:4px 0;transform-style:preserve-3d;}
.ring{position:absolute;inset:14px;border:1.5px dashed rgba(63,114,175,.35);border-radius:50%;animation:spin 20s linear infinite;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.orbchip{position:absolute;top:50%;left:50%;transform:rotate(var(--a)) translate(calc(min(150px,37vw))) rotate(calc(-1 * var(--a)));}
.chipinner{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-family:var(--font-mono);font-size:10.5px;color:var(--navy);white-space:nowrap;box-shadow:var(--shadow);animation:spinRev 20s linear infinite;translate:-50% -50%;}
@keyframes spinRev{from{rotate:0deg;}to{rotate:-360deg;}}
.stuckbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--coral);color:#fff;border:none;border-radius:999px;padding:15px 26px;font-family:var(--font-body);font-weight:700;font-size:16px;box-shadow:0 8px 30px rgba(224,122,95,.35);animation:btnPulse 2s ease-in-out infinite;cursor:default;}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,122,95,.35);}50%{box-shadow:0 0 0 16px rgba(224,122,95,0);}}
.tagline{font-family:var(--font-heading);font-weight:900;font-size:clamp(20px,3.5vw,32px);color:var(--navy);
  text-shadow:1px 1px 0 rgba(17,45,78,.12),2px 2px 0 rgba(17,45,78,.09),3px 3px 0 rgba(17,45,78,.06),4px 4px 0 rgba(17,45,78,.03);}

/* ===== PROGRESS + CONTROLS ===== */
#prog{position:fixed;left:0;right:0;bottom:44px;height:3px;background:var(--border);cursor:pointer;z-index:51;}
#progFill{height:100%;width:0;background:var(--teal);}
.dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--teal);z-index:52;pointer-events:none;}
.dot.past{background:var(--teal);}
.dot.next{animation:dotPulse 1.6s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(63,114,175,.35);}50%{box-shadow:0 0 0 7px rgba(63,114,175,0);}}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-top:1px solid var(--border);z-index:50;}
.cb{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--border);background:transparent;border-radius:8px;color:var(--navy);cursor:pointer;display:grid;place-items:center;font-size:12px;transition:background .2s,color .2s;}
.cb:hover{background:var(--teal-soft);}
.cb.on{background:var(--teal);color:#fff;border-color:var(--teal);}
#cap{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--navy);}
#cap.cap-in{animation:capIn .35s ease;}
@keyframes capIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
#time{font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:0 0 auto;}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion:reduce){
  .docstack,.phone,.tier,.ring,.chipinner,.stuckbtn,.duecard,.bgshape,.particle,.dot.next{animation:none !important;}
  .scene,[data-at]{transition-duration:.2s !important;}
  #sceneFlash.fire{animation:none !important;opacity:0;}
}
</style>
</head>
<body>

<div class="bgshape" id="bg1"></div>
<div class="bgshape" id="bg2"></div>
<div id="sceneFlash"></div>
<div id="stage"></div>

<div id="prog"><div id="progFill"></div></div>
<div id="bar">
  <button class="cb" id="btnPrev" title="Previous scene (←)">◀</button>
  <button class="cb" id="btnPlay" title="Play / pause (Space)">▶</button>
  <button class="cb" id="btnNext" title="Next scene (→)">▶▶</button>
  <div id="cap"></div>
  <div id="time">00:00 / 00:00</div>
</div>

<script>
/* ================= DATA ================= */
const TOTAL = 75;

const scenes = [
{ start:0, end:22, html:`
  <div class="subtitle" data-at="0.5">Scene 01 · The Problem</div>
  <h1 class="title" data-at="1.2">A letter <span class="hl">nobody understands</span></h1>
  <div class="docstack" data-at="2.4">
    <div class="doc d1"><div class="docline" style="width:60%"></div><div class="docline" style="width:88%"></div><div class="docline" style="width:74%"></div></div>
    <div class="doc d2"><div class="docline" style="width:70%"></div><div class="docline" style="width:92%"></div><div class="docline" style="width:55%"></div></div>
    <div class="doc d3">
      <span class="stamp">官方公文</span>
      <div class="docline" style="width:46%"></div>
      <div class="docline" style="width:90%"></div>
      <div class="docline" style="width:82%"></div>
      <div class="docline" style="width:64%"></div>
      <div class="duecard">DEADLINE PASSED ✕</div>
    </div>
  </div>
  <p class="note" data-at="5">Real subsidies exist — but they hide behind <code>bureaucratic language</code> and silent deadlines. Help is real. Access is not.</p>
`},
{ start:22, end:52, html:`
  <div class="subtitle" data-at="22.5">Scene 02 · The Solution</div>
  <h1 class="title" data-at="23.2">Speak, and get <span class="hl">plain answers</span></h1>
  <div class="solwrap" data-at="24.2">
    <div class="phone"><div class="screen">
      <div class="bub user" data-at="25">風颱了後，果園損失真嚴重…</div>
      <div class="bub bot" data-at="26.5">I hear you. Let me look for programs that match your situation.</div>
      <div class="bub bot" data-at="28">Found 3 programs — sorted for you 👇</div>
    </div></div>
    <div class="tiers">
      <div class="tier t1" data-at="30"><span class="tl">TIER 1</span><b>Recommended to check first</b><small>Disaster relief · deadline soon</small></div>
      <div class="tier t2" data-at="32"><span class="tl">TIER 2</span><b>Possibly relevant</b><small>One more answer will tell</small></div>
      <div class="tier t3" data-at="34"><span class="tl">TIER 3</span><b>Skip for now</b><small>Tap to see why</small></div>
    </div>
  </div>
  <div class="disclaim" data-at="44">* Final eligibility is determined by the responsible agency.</div>
  <p class="note" data-at="38">Describe your situation in your own words — <code>even in Taiwanese</code>. Snap a photo, and bureaucratic text becomes plain words.</p>
`},
{ start:52, end:75, html:`
  <div class="subtitle" data-at="52.5">Scene 03 · The Loop</div>
  <h1 class="title" data-at="53.2">No farmer left <span class="hl">stuck</span></h1>
  <div class="orbit" data-at="54.2">
    <div class="ring">
      <div class="orbchip" style="--a:0deg"><span class="chipinner">Too complicated</span></div>
      <div class="orbchip" style="--a:120deg"><span class="chipinner">Can't get the documents</span></div>
      <div class="orbchip" style="--a:240deg"><span class="chipinner">Don't understand</span></div>
    </div>
    <button class="stuckbtn">I'm stuck</button>
  </div>
  <div class="tagline" data-at="66">Plain answers, on the farmer's side.</div>
  <p class="note" data-at="59">One tap turns giving up into a <code>help signal</code> — the loop closes when a helper reaches back.</p>
`}
];

const subs = [
  { s:0,    e:5,    t:"Subsidies exist. Farmers miss them." },
  { s:5,    e:11,   t:"An official letter arrives — written for offices, not for farmers." },
  { s:11,   e:16,   t:"Deadlines slip by, unseen." },
  { s:16,   e:22,   t:"The help is real. The access is not." },
  { s:22,   e:28,   t:"Just say your situation — in your own words, even in Taiwanese." },
  { s:28,   e:35,   t:"AI matches programs and sorts them into three tiers." },
  { s:35,   e:42,   t:"Recommended to check first · Possibly relevant · Skip for now." },
  { s:42,   e:47,   t:"Snap a photo — bureaucratic text becomes plain words." },
  { s:47,   e:52,   t:"Final eligibility is always determined by the responsible agency." },
  { s:52,   e:58,   t:"Stuck? One tap: “I'm stuck.”" },
  { s:58,   e:64,   t:"Too complicated · Can't get the documents · Don't understand." },
  { s:64,   e:69,   t:"Giving up becomes a signal — and help reaches back." },
  { s:69,   e:75,   t:"Farmer Aid Station — plain answers, on the farmer's side." }
];

/* ================= SETUP ================= */
const stage = document.getElementById('stage');
const sceneEls = scenes.map(sc => {
  const el = document.createElement('div');
  el.className = 'scene';
  el.innerHTML = sc.html;
  stage.appendChild(el);
  return el;
});

// ambient particles
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 4 + Math.random() * 9;
  p.style.width = p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.background = Math.random() > 0.5 ? 'var(--teal-soft)' : 'var(--coral-soft)';
  p.style.animationDuration = (16 + Math.random() * 22) + 's';
  p.style.animationDelay = (-Math.random() * 30) + 's';
  document.body.appendChild(p);
}

// chapter dots (skip scene 0)
const prog = document.getElementById('prog');
const dots = scenes.slice(1).map(sc => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.style.left = (sc.start / TOTAL * 100) + '%';
  d.dataset.time = sc.start;
  prog.appendChild(d);
  return d;
});

const progFill = document.getElementById('progFill');
const capEl = document.getElementById('cap');
const timeEl = document.getElementById('time');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const flash = document.getElementById('sceneFlash');

let t = 0, playing = false, lastTs = null, sceneIdx = -1, lastCap = null, prevActive = -1;

const fmt = s => {
  s = Math.max(0, Math.floor(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};

function fireFlash() {
  flash.classList.remove('fire');
  void flash.offsetWidth;
  flash.classList.add('fire');
}

function render() {
  // active scene
  let idx = scenes.findIndex(sc => t >= sc.start && t < sc.end);
  if (idx === -1) idx = scenes.length - 1;
  if (idx !== sceneIdx) {
    sceneEls.forEach((el, i) => {
      if (i === idx) { el.classList.add('active'); el.classList.remove('zoom-out'); }
      else {
        if (el.classList.contains('active')) { el.classList.remove('active'); el.classList.add('zoom-out'); }
        else if (i !== prevActive) el.classList.remove('zoom-out');
      }
    });
    prevActive = sceneIdx;
    sceneIdx = idx;
    if (sceneIdx >= 0) fireFlash();
  }

  // timed reveals
  stage.querySelectorAll('[data-at]').forEach(el => {
    el.classList.toggle('shown', t >= parseFloat(el.dataset.at));
  });

  // captions
  const sub = subs.find(s => t >= s.s && t < s.e);
  const txt = sub ? sub.t : '';
  if (txt !== lastCap) {
    lastCap = txt;
    capEl.textContent = txt;
    capEl.classList.remove('cap-in');
    void capEl.offsetWidth;
    capEl.classList.add('cap-in');
  }

  // progress + dots + timer
  progFill.style.width = (t / TOTAL * 100) + '%';
  let nextFound = false;
  dots.forEach(d => {
    const dt = parseFloat(d.dataset.time);
    d.classList.toggle('past', t >= dt);
    if (t < dt && !nextFound) { d.classList.add('next'); nextFound = true; }
    else d.classList.remove('next');
  });
  timeEl.textContent = fmt(t) + ' / ' + fmt(TOTAL);
}

function setPlaying(p) {
  playing = p;
  lastTs = null;
  btnPlay.classList.toggle('on', p);
  btnPlay.textContent = p ? '❚❚' : '▶';
}

function seek(nt) {
  t = Math.min(TOTAL, Math.max(0, nt));
  render();
}

function tick(ts) {
  if (playing) {
    if (lastTs !== null) t += (ts - lastTs) / 1000;
    lastTs = ts;
    if (t >= TOTAL) { t = TOTAL; setPlaying(false); }
  }
  render();
  requestAnimationFrame(tick);
}

/* ================= CONTROLS ================= */
function prevScene() {
  const cur = scenes[Math.max(0, sceneIdx)];
  if (t - cur.start > 1.5) seek(cur.start);
  else seek(scenes[Math.max(0, sceneIdx - 1)].start);
}
function nextScene() {
  if (sceneIdx < scenes.length - 1) seek(scenes[sceneIdx + 1].start);
  else seek(TOTAL);
}

btnPlay.addEventListener('click', () => { if (t >= TOTAL) t = 0; setPlaying(!playing); });
btnPrev.addEventListener('click', prevScene);
btnNext.addEventListener('click', nextScene);

prog.addEventListener('click', e => {
  const r = prog.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * TOTAL);
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (t >= TOTAL) t = 0; setPlaying(!playing); }
  else if (e.code === 'ArrowLeft') prevScene();
  else if (e.code === 'ArrowRight') nextScene();
});

let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) (dx < 0 ? nextScene() : prevScene());
  touchX = null;
}, { passive: true });

/* ================= START ================= */
render();
setPlaying(true);
requestAnimationFrame(tick);
</script>
</body>
</html>
